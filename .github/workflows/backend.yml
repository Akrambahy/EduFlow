name: backend

on:
  pull_request:
    paths: ["backend/**", "docs/api/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "docs/api/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eduflow
          POSTGRES_PASSWORD: eduflow
          POSTGRES_DB: eduflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eduflow -d eduflow_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://eduflow:eduflow@localhost:5432/eduflow_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Speed up Postgres for tests
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U eduflow -d eduflow_test -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off"
          docker exec ${{ job.services.postgres.id }} psql -U eduflow -d eduflow_test -c "SELECT pg_reload_conf()"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: test
        run: go test -count=1 -race ./...
      - name: build
        run: go build ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --redact --config /repo/.gitleaks.toml

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t eduflow-backend:ci backend
